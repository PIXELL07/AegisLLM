[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisllm"
version = "0.1.0"
description = "A modular AI security benchmarking framework for evaluating LLMs and AI agents."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
include = ["aegis*"]
exclude = ["datasets*", "tests*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"