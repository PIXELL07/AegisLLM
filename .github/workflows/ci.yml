name: AegisLLM CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Tests

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install AegisLLM
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest -q

  security-regression:
    name: Security Regression Check

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install AegisLLM
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run security regression check
        run: |
          python scripts/compare_runs.py \
            tests/fixtures/regression/baseline.json \
            tests/fixtures/regression/safe-current.json \
            --asr-threshold 0.0 \
            --risk-threshold 0.0 \
            --category-threshold 0.0 \
            --output results/ci-regression-report.json

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-regression-report
          path: results/ci-regression-report.json
          if-no-files-found: ignore